name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Build interactive visualizer example
        run: |
          npm install --prefix examples/interactive-visualizer --no-package-lock --no-audit --no-fund
          npm run --prefix examples/interactive-visualizer build
      - name: Typecheck
        run: npm run typecheck
      - run: npm test
      - run: npm run test:oauth
      - run: npm run test:conformance
      - run: npm pack --dry-run

  bun-dispatch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Verify requested revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install and build visualizer fixture
        working-directory: examples/interactive-visualizer
        run: bun install --ignore-scripts && bun --no-env-file scripts/build.mjs
      - name: Strict types
        run: bun --no-env-file node_modules/typescript/bin/tsc --noEmit
      - name: Canonical Bun suite
        run: bun run test:bun
      - name: Packaged public exports
        run: bun run test:public-exports:bun

  node24-worker-fds:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test -- --run __tests__/mcp-code.test.ts
